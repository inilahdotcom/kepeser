services:
  migrate:
    build: .
    command: node --experimental-strip-types scripts/migrate.ts
    environment:
      DATABASE_URL: /app/data/kepeser.db
    volumes:
      - kepeser-data:/app/data
    restart: "no"

  web:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      # Nitro mendengarkan 3000 kalau PORT tidak diset — sementara ports: memetakan
      # 2112. Tanpa baris ini container hidup tapi tidak bisa dihubungi sama sekali.
      PORT: 2112
      DATABASE_URL: /app/data/kepeser.db
      UPLOAD_DIR: /app/data/uploads
      ALLOWED_EMAIL_DOMAIN: ${ALLOWED_EMAIL_DOMAIN:-inilah.com}
      APP_URL: ${APP_URL:-http://localhost:2112}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Kepeser <no-reply@inilah.com>}
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD:?wajib diisi, minimal 32 karakter}
      SEED_SUPERVISOR_EMAIL: ${SEED_SUPERVISOR_EMAIL:-}
      SEED_SUPERVISOR_PASSWORD: ${SEED_SUPERVISOR_PASSWORD:-}
      SEED_SUPERVISOR_NAME: ${SEED_SUPERVISOR_NAME:-IT Supervisor}
    ports:
      - "2112:2112"
    volumes:
      - kepeser-data:/app/data
    restart: unless-stopped

volumes:
  kepeser-data:
